# ============================================================
# RAG-PDF — Production Nginx Reverse Proxy Configuration
# ============================================================

upstream rag_api {
    # Forward to the rag-api service container on port 8000
    server rag-api:8000;
    
    # Maintain up to 32 idle keepalive connections to upstream servers
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ── Security Headers ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # ── RAG-Specific Optimizations ──────────────────────────────
    # Allow large PDF uploads (default is 1MB which fails for books/reports)
    client_max_body_size 50M;

    # Extended timeouts for slow LLM embedding and RAG generation queries
    # Default 60s is often too short for deep reasoning or local Ollama models
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # ── Nginx Instant Healthcheck ───────────────────────────────
    # Used by Docker HEALTHCHECK or AWS/GCP Load Balancers without hitting Python
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # ── API & Application Routing ───────────────────────────────
    location / {
        proxy_pass http://rag_api;
        
        # HTTP 1.1 support for keepalive & streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Proxy headers so FastAPI knows real client IP and scheme
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering for SSE (Server-Sent Events) or LLM token streaming
        proxy_buffering off;
        proxy_cache off;
    }
}
