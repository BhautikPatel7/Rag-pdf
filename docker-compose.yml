# ============================================================
# RAG-PDF — Docker Compose
# ============================================================
# Usage:
#   Default (Gemini + ChromaDB):
#     docker compose up
#
#   With Ollama (local LLM):
#     docker compose --profile ollama up
#
#   With Pinecone (cloud vector store):
#     Set VECTOR_STORE=pinecone in .env, then:
#     docker compose up
# ============================================================

services:

  # ── RAG API (FastAPI) ──────────────────────────────────────
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: rag-pdf-api
    image: rag-pdf-api:latest
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Override ChromaDB path to use the named volume
      CHROMA_PERSIST_DIR: /data/chroma_db
      PDF_UPLOAD_DIR: /data/pdfs
    volumes:
      # Persistent ChromaDB storage
      - chroma_data:/data/chroma_db
      # Persistent PDF storage (optional — mount local PDFs here)
      - pdf_data:/data/pdfs
      # Hot-reload in dev: mount source
      - ./src:/app/src
      - ./api:/app/api
    depends_on:
      chromadb:
        condition: service_healthy
        required: false   # not required when VECTOR_STORE=pinecone
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - rag-net

  # ── ChromaDB Server (used when VECTOR_STORE=chromadb) ─────
  # Can be disabled by setting VECTOR_STORE=pinecone
  chromadb:
    image: chromadb/chroma:0.5.4
    container_name: rag-chromadb
    profiles: ["chromadb"]   # start with: docker compose --profile chromadb up
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - rag-net

  # ── Ollama (used when LLM_PROVIDER=ollama) ────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    profiles: ["ollama"]    # start with: docker compose --profile ollama up
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    restart: unless-stopped
    # Pull the default model on startup
    # Change OLLAMA_MODEL in .env; llava for vision support
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull ${OLLAMA_MODEL:-llama3.2} &&
             ollama pull llava &&
             wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 120s    # model pull takes time
      retries: 5
    networks:
      - rag-net

# ── Networks ──────────────────────────────────────────────────
networks:
  rag-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────
volumes:
  chroma_data:
    driver: local
  pdf_data:
    driver: local
  ollama_models:
    driver: local
