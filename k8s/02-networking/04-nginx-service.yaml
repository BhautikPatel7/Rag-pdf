apiVersion: v1
kind: Service
metadata:
  name: rag-nginx
  namespace: rag-pdf
  labels:
    app.kubernetes.io/name: rag-nginx
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part: "02-networking"
spec:
  # In cloud environments (AWS/GCP/Azure/DigitalOcean), LoadBalancer provisions a real external IP.
  # For local learning (Minikube, Kind, Docker Desktop K8s), you can access it via localhost:80
  # or change this to NodePort (e.g., nodePort: 30080).
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: rag-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
