apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag-pdf
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part: "02-networking"
spec:
  # ClusterIP is the default service type. It creates an internal-only IP inside the K8s cluster.
  # This replaces Docker Compose's internal network resolution!
  # Other pods can reach this service via: http://rag-api.rag-pdf.svc.cluster.local:8000
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
