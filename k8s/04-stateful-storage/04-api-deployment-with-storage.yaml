apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api-deployment
  namespace: rag-pdf
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part: "04-stateful-storage"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: rag-api
          image: rag-pdf-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          # Mounting our PersistentVolumeClaim so uploaded PDFs survive pod restarts!
          volumeMounts:
            - name: pdf-storage
              mountPath: /data/pdfs
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
      volumes:
        - name: pdf-storage
          persistentVolumeClaim:
            claimName: pdf-data-pvc
