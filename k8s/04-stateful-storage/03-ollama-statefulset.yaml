apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama
  namespace: rag-pdf
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: llm
    app.kubernetes.io/part: "04-stateful-storage"
spec:
  serviceName: "ollama"
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: llm
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: rag-config
                  key: OLLAMA_MODEL
          # Translating Docker Compose entrypoint to Kubernetes container command & args
          command: ["sh", "-c"]
          args:
            - |
              ollama serve &
              sleep 5 &&
              ollama pull ${OLLAMA_MODEL:-llama3.2} &&
              ollama pull llava &&
              wait
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "4Gi"
              cpu: "2000m"
            limits:
              memory: "8Gi"
              cpu: "4000m"
  volumeClaimTemplates:
    - metadata:
        name: ollama-models
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 30Gi
