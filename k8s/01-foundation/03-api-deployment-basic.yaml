apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api-deployment
  namespace: rag-pdf
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part: "01-foundation"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: rag-api
          image: rag-pdf-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          # Basic environment variables directly in spec (in Part 3 we will move these to ConfigMaps & Secrets!)
          env:
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
            - name: CHROMA_PERSIST_DIR
              value: "/data/chroma_db"
            - name: PDF_UPLOAD_DIR
              value: "/data/pdfs"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
