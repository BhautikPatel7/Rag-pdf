apiVersion: v1
kind: Secret
metadata:
  name: rag-secrets
  namespace: rag-pdf
  labels:
    app.kubernetes.io/name: rag-secrets
    app.kubernetes.io/part: "03-configuration"
type: Opaque
# stringData allows you to enter plain text values; Kubernetes automatically base64-encodes them when stored!
# Note: In production, never commit real secrets to Git! Use SealedSecrets, ExternalSecrets (e.g. AWS Secrets Manager), or Vault.
stringData:
  GEMINI_API_KEY: "replace-with-your-real-gemini-api-key"
  PINECONE_API_KEY: "replace-with-your-real-pinecone-api-key"
