apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api-deployment
  namespace: rag-pdf
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part: "03-configuration"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: rag-api
          image: rag-pdf-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          # Notice how clean this is! No more hardcoding dozens of variables.
          # envFrom pulls all keys from our ConfigMap and Secret as environment variables.
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
