apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  namespace: rag-pdf
  labels:
    app.kubernetes.io/name: rag-config
    app.kubernetes.io/part: "03-configuration"
data:
  # ── API Server ───────────────────────────────────────────────
  API_PORT: "8000"
  API_HOST: "0.0.0.0"
  API_RELOAD: "false"
  LOG_LEVEL: "info"
  
  # ── LLM Provider ─────────────────────────────────────────────
  LLM_PROVIDER: "gemini"        # Options: "gemini" | "ollama"
  GEMINI_MODEL: "gemini-2.0-flash"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.2"
  OLLAMA_VISION_MODEL: "llava"
  
  # ── Embedding Model ──────────────────────────────────────────
  EMBEDDING_PROVIDER: "local"   # Options: "local" | "gemini"
  LOCAL_EMBEDDING_MODEL: "all-MiniLM-L6-v2"
  
  # ── Vector Store ─────────────────────────────────────────────
  VECTOR_STORE: "chromadb"      # Options: "chromadb" | "pinecone"
  CHROMA_MODE: "server"         # In K8s, we connect to our dedicated chromadb StatefulSet!
  CHROMA_HOST: "chromadb"       # Resolves via Kubernetes DNS to our chromadb service
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION_NAME: "rag_pdf_collection"
  CHROMA_PERSIST_DIR: "/data/chroma_db"
  PINECONE_ENVIRONMENT: "us-east-1"
  PINECONE_INDEX_NAME: "rag-pdf"
  PINECONE_DIMENSION: "384"
  
  # ── Ingestion Settings ───────────────────────────────────────
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP: "200"
  PDF_UPLOAD_DIR: "/data/pdfs"
  
  # ── RAGAS Evaluation ─────────────────────────────────────────
  RAGAS_FAITHFULNESS: "true"
  RAGAS_ANSWER_RELEVANCY: "true"
  RAGAS_CONTEXT_PRECISION: "true"
  RAGAS_CONTEXT_RECALL: "true"
