# ============================================================
# RAG-PDF — Production Docker Compose
# ============================================================
# Usage:
#   Start Production Stack (Nginx + RAG API + ChromaDB):
#     docker compose -f docker-compose.prod.yml up -d
#
#   Start with Local LLM (Ollama):
#     docker compose -f docker-compose.prod.yml --profile ollama up -d
# ============================================================

services:

  # ── Nginx Reverse Proxy (Public Gateway) ───────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: rag-pdf-nginx
    image: rag-pdf-nginx:latest
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      rag-api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - rag-net

  # ── RAG API (FastAPI - Internal Only) ──────────────────────
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: rag-pdf-api-prod
    image: rag-pdf-api:latest
    # Notice: No external ports exposed! All traffic must pass through Nginx.
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIR: /data/chroma_db
      PDF_UPLOAD_DIR: /data/pdfs
      API_HOST: 0.0.0.0
      API_PORT: 8000
    volumes:
      # Persistent storage only — NO code bind mounts in production!
      - chroma_data:/data/chroma_db
      - pdf_data:/data/pdfs
    depends_on:
      chromadb:
        condition: service_healthy
        required: false
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - rag-net

  # ── ChromaDB Server ────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:0.5.4
    container_name: rag-chromadb-prod
    profiles: ["chromadb"]
    expose:
      - "8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 20s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - rag-net

  # ── Ollama (Local LLM) ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama-prod
    profiles: ["ollama"]
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    entrypoint: >
      sh -c "ollama serve &
             sleep 5 &&
             ollama pull ${OLLAMA_MODEL:-llama3.2} &&
             ollama pull llava &&
             wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    networks:
      - rag-net

# ── Networks ──────────────────────────────────────────────────
networks:
  rag-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────
volumes:
  chroma_data:
    driver: local
  pdf_data:
    driver: local
  ollama_models:
    driver: local
